<div class="column-popover">
  <button
    class="erp-button erp-button--secondary erp-button--compact column-popover__trigger"
    type="button"
    [class.is-active]="hiddenCount() > 0"
    [attr.aria-controls]="panelId"
    [attr.aria-expanded]="open()"
    (click)="open.update((current) => !current)"
  >
    <svg lucideColumns3 size="15" aria-hidden="true"></svg>
    <span>Columns</span>
    @if (hiddenCount()) {
      <small>{{ hiddenCount() }}</small>
    }
  </button>

  @if (open()) {
    <button
      class="column-popover__backdrop"
      type="button"
      tabindex="-1"
      aria-label="Close columns"
      (click)="open.set(false)"
    ></button>
    <section class="column-popover__panel" [id]="panelId" role="dialog" aria-label="Columns">
      <header>
        <div>
          <strong>Table columns</strong>
          <span>Choose the details shown</span>
        </div>
        <button type="button" aria-label="Close columns" (click)="open.set(false)">
          <svg lucideX size="16" aria-hidden="true"></svg>
        </button>
      </header>
      <div class="column-popover__options">
        @for (option of options(); track option.id) {
          <button
            type="button"
            [class.is-active]="visible().includes(option.id)"
            [attr.aria-pressed]="visible().includes(option.id)"
            (click)="toggle(option.id)"
          >
            <span>{{ option.label }}</span>
            <span class="column-popover__check">
              @if (visible().includes(option.id)) {
                <svg lucideCheck size="14" aria-hidden="true"></svg>
              }
            </span>
          </button>
        }
      </div>
      <footer>
        <button
          class="erp-button erp-button--ghost erp-button--compact"
          type="button"
          [disabled]="hiddenCount() === 0"
          (click)="reset()"
        >
          Reset columns
        </button>
      </footer>
    </section>
  }
</div>
