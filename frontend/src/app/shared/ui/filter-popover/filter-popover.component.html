<div class="filter-popover">
  <button
    class="erp-button erp-button--secondary erp-button--compact filter-popover__trigger"
    type="button"
    [class.is-active]="activeCount() > 0"
    [attr.aria-controls]="panelId"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg lucideFilter size="15" aria-hidden="true"></svg>
    <span>{{ label() }}</span>
    @if (activeCount()) {
      <small>{{ activeCount() }}</small>
    }
  </button>

  @if (open()) {
    <button
      class="filter-popover__backdrop"
      type="button"
      tabindex="-1"
      aria-label="Close filters"
      (click)="open.set(false)"
    ></button>
    <section class="filter-popover__panel" [id]="panelId" role="dialog" aria-label="{{ label() }}">
      <header>
        <strong>{{ label() }}</strong>
        <button type="button" aria-label="Close filters" (click)="open.set(false)">
          <svg lucideX size="16" aria-hidden="true"></svg>
        </button>
      </header>
      @if (fields().length) {
        <div class="filter-popover__intro">
          <strong>Refine results</strong>
          <span>Use one or more fields to narrow this list.</span>
        </div>
        <div class="filter-popover__fields">
          @for (field of fields(); track field.id) {
            <label>
              <span>{{ field.label }}</span>
              @if (field.type === 'select') {
                <select
                  class="erp-control"
                  [ngModel]="draftValues()[field.id] || ''"
                  (ngModelChange)="updateDraft(field.id, $event)"
                >
                  <option value="">All {{ field.label.toLowerCase() }}</option>
                  @for (option of field.options || []; track option.value) {
                    <option [value]="option.value">{{ option.label }}</option>
                  }
                </select>
              } @else {
                <input
                  class="erp-control"
                  type="text"
                  [placeholder]="field.placeholder || 'Enter ' + field.label.toLowerCase()"
                  [ngModel]="draftValues()[field.id] || ''"
                  (ngModelChange)="updateDraft(field.id, $event)"
                  (keydown.enter)="apply()"
                />
              }
            </label>
          }
        </div>
      } @else {
        <div class="filter-popover__options">
          @for (option of options(); track option.value) {
          <button
            type="button"
            [class.is-active]="value() === option.value"
            (click)="select(option.value)"
          >
            <span>{{ option.label }}</span>
            @if (value() === option.value) {
              <svg lucideCheck size="16" aria-hidden="true"></svg>
            }
          </button>
          }
        </div>
      }
      <footer>
        <button
          class="erp-button erp-button--ghost erp-button--compact"
          type="button"
          (click)="reset()"
        >
          Clear all
        </button>
        @if (fields().length) {
          <span class="filter-popover__footer-actions">
            <button class="erp-button erp-button--secondary erp-button--compact" type="button" (click)="open.set(false)">Cancel</button>
            <button class="erp-button erp-button--primary erp-button--compact" type="button" (click)="apply()">Apply filters</button>
          </span>
        }
      </footer>
    </section>
  }
</div>
