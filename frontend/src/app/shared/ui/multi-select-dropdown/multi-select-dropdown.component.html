<div class="multi-select-dropdown">
  <button
    class="erp-control multi-select-dropdown__trigger"
    type="button"
    [disabled]="disabled()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    (click)="open.update((value) => !value)"
  >
    <span [class.is-placeholder]="!value().length">{{ summary() }}</span
    ><svg lucideChevronDown size="17" aria-hidden="true"></svg>
  </button>
  @if (open()) {
    <button
      class="multi-select-dropdown__backdrop"
      type="button"
      tabindex="-1"
      aria-label="Close options"
      (click)="open.set(false)"
    ></button>
    <section
      class="multi-select-dropdown__panel"
      [id]="panelId"
      role="listbox"
      aria-multiselectable="true"
    >
      <header>
        <strong>Select options</strong
        ><button type="button" aria-label="Close options" (click)="open.set(false)">
          <svg lucideX size="16" aria-hidden="true"></svg>
        </button>
      </header>
      <div class="multi-select-dropdown__options">
        @for (option of options(); track option.value) {
          <button
            type="button"
            role="option"
            [attr.aria-selected]="value().includes(option.value)"
            [class.is-selected]="value().includes(option.value)"
            (click)="toggle(option.value)"
          >
            <span>{{ option.label }}</span>
            @if (value().includes(option.value)) {
              <svg lucideCheck size="16" aria-hidden="true"></svg>
            }
          </button>
        } @empty {
          <p>No options available.</p>
        }
      </div>
      <footer>
        <button
          class="erp-button erp-button--ghost erp-button--compact"
          type="button"
          [disabled]="!value().length"
          (click)="clear()"
        >
          Clear</button
        ><button
          class="erp-button erp-button--primary erp-button--compact"
          type="button"
          (click)="open.set(false)"
        >
          Done
        </button>
      </footer>
    </section>
  }
</div>
