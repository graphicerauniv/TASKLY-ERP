<erp-admin-page
  title="Finance operations"
  description="Choose a focused workspace for configuration, fee preparation or collections."
  variant="compact"
>
  <a page-actions class="erp-button erp-button--primary" routerLink="/admin/accounts/payments"
    >Open student payments <svg lucideArrowRight size="17" aria-hidden="true"
  /></a>
  <div class="erp-finance-workspaces">
    @for (group of groups; track group.title) {
      <section class="erp-card erp-card--padded">
        <header class="erp-card__header">
          <div class="erp-finance-group-heading">
            <erp-admin-illustration [kind]="group.illustration" size="compact" />
            <div>
              <h2>{{ group.title }}</h2>
              <p>{{ group.description }}</p>
            </div>
          </div>
        </header>
        <nav class="erp-crm-workspace-links" [attr.aria-label]="group.title">
          @for (link of group.links; track link.route) {
            <a [routerLink]="link.route"
              ><span
                ><strong>{{ link.title }}</strong
                ><small>{{ link.description }}</small></span
              ><svg lucideArrowRight size="18" aria-hidden="true"
            /></a>
          }
        </nav>
      </section>
    }
  </div>
</erp-admin-page>
